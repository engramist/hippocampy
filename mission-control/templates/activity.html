{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <header class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-100">Activity Feed</h1>
            <p class="text-sm text-slate-400">Live tool calls and session activity across all agents. Updates every 5 seconds.</p>
        </div>
        <div class="flex items-center space-x-3">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-xs text-slate-400 font-mono">LIVE</span>
        </div>
    </header>

    <!-- Agent Status Row -->
    <div class="flex flex-wrap gap-3" id="agent-status"
         hx-get="/api/activity/agents"
         hx-trigger="load, every 5s"
         hx-swap="innerHTML">
        <div class="text-xs text-slate-500 italic">Loading agents...</div>
    </div>

    <!-- Live Feed -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <header class="px-5 py-3 bg-slate-700/40 border-b border-slate-700 flex justify-between items-center">
            <h2 class="font-semibold text-slate-200 flex items-center space-x-2">
                <span>Tool Calls &amp; Events</span>
                <span class="text-[10px] px-2 py-0.5 bg-green-900/40 text-green-400 border border-green-500/30 rounded-full font-bold uppercase">Live</span>
            </h2>
            <span class="text-[10px] text-slate-500 font-mono">last 100 events</span>
        </header>

        <div id="activity-feed"
             class="divide-y divide-slate-700/40 max-h-[600px] overflow-y-auto custom-scrollbar font-mono text-xs"
             hx-get="/api/activity/feed"
             hx-trigger="load, every 5s"
             hx-swap="innerHTML">
            <div class="p-6 text-center text-slate-500 italic">Loading activity...</div>
        </div>
    </div>

</div>
{% endblock %}
