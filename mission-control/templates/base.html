<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "SideQuests Mission Control" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/mission.css">
    <style>
        [vx-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-4">
            <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-500">
                SideQuests
            </span>
            <span class="text-slate-400 font-medium text-sm tracking-widest uppercase">Mission Control</span>
        </div>
        <div class="flex space-x-6">
            <a href="/" class="px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.url.path == '/' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                Dashboard
            </a>
            <a href="/board" class="px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.url.path == '/board' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                Kanban Board
            </a>
            <a href="/digest" class="px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.url.path == '/digest' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                Daily Digest
            </a>
            <a href="/activity" class="px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.url.path == '/activity' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                Activity
            </a>
            <a href="/thinking" class="px-3 py-2 rounded-md text-sm font-medium transition-colors {% if request.url.path == '/thinking' %}bg-blue-600 text-white{% else %}text-slate-300 hover:bg-slate-700 hover:text-white{% endif %}">
                Thinking
            </a>
        </div>
        <div class="text-xs text-slate-500 font-mono">
            {{ now if now else "" }}
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-500">
        <p>&copy; 2026 SideQuests Brain Daemon — Gated Consolidation Loop v0.9</p>
    </footer>
</body>
</html>
