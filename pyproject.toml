[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidequests-brain"
version = "0.1.0"
description = "Persistent AI memory with a Gated Consolidation Loop and graph-native Kùzu knowledge base"
license = { text = "UNLICENSED" }
requires-python = ">=3.11"
authors = [
    { name = "SideQuests" },
]
keywords = ["ai", "memory", "mcp", "knowledge-graph", "kuzu", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]

dependencies = [
    "kuzu==0.11.3",
    "sentence-transformers>=3.3,<4",
    "spacy>=3.8,<4",
    "openai>=1.50,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "click>=8.1,<9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "build>=1.0",
]

[project.scripts]
sidequests        = "sidequests.cli.main:cli"
sidequests-daemon = "sidequests.daemon:main"

[project.urls]
Issues = "https://github.com/yourusername/sidequests-brain/issues"

[tool.hatch.build.targets.wheel]
packages = ["sidequests", "mcp_engine", "adapters", "web"]

[tool.hatch.build.targets.sdist]
include = [
    "sidequests/",
    "mcp_engine/",
    "adapters/",
    "web/",
    "brain_daemon.py",
    "sidequests.toml",
    "requirements.txt",
    "InvertorsDocs/GistSeedExamples.md",
    "README.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
