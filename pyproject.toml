[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidequests-brain"
version = "0.1.0-rc1"
description = "Local AI memory system with gated consolidation loop and graph-native Kùzu database"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SideQuests", email = "sidequests@example.com" }]
keywords = ["ai", "memory", "graph-database", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "kuzu==0.11.3",
    "sentence-transformers>=2.2.0",
    "spacy>=3.7.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "build>=1.0",
    "twine>=5.0",
    "black",
    "ruff",
]
ollama = ["ollama-python>=0.1.0"]

[project.scripts]
sidequests = "sidequests.cli.main:app"
sidequests-daemon = "sidequests.daemon:main"

[project.urls]
Homepage = "https://github.com/djs54/sidequests-brain"
Issues = "https://github.com/djs54/sidequests-brain/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sidequests*", "mcp_engine*", "adapters*", "web*"]

[tool.setuptools.package-data]
"sidequests.data" = ["*.md"]
"*" = ["sidequests.toml"]
