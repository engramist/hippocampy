[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hippocampy"
version = "0.1.0"
description = "Local AI memory system with gated consolidation loop and graph-native RDF-star database"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HippoCampy", email = "hello@hippocampy.dev" }]
keywords = ["ai", "memory", "graph-database", "mcp", "knowledge-graph", "oxigraph", "rdf-star"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# B428: narrowed from ">=3.12,<3.14" (Sep 2026 re-vet finding, confirmed against
# PyPI's actual wheel listings): `tree-sitter-languages` — used by
# campy/brain/thalamus/compression/ast_mapper.py — ships no cp313 wheel for any
# version, and its maintained successor (`tree-sitter-language-pack`) doesn't
# either as of this writing. `spacy` is NOT the blocker (3.8.16+ ships cp313
# wheels) — only tree-sitter-languages is. Re-widen once that has a cp313 wheel
# or is replaced.
requires-python = ">=3.12,<3.13"
dependencies = [
    # B355: ONNX Runtime replaced sentence-transformers/PyTorch as the local
    # embedding backend -- same model (sentence-transformers/all-MiniLM-L6-v2,
    # via its ONNX conversion qdrant/all-MiniLM-L6-v2-onnx), ~60-80MB instead
    # of ~1.2GB. B512: run it directly (campy/brain/hippocampus/graph/
    # onnx_embedder.py) instead of through fastembed, whose every release caps
    # pillow<13 (37 advisories on pillow 12.3.0, B500). Output is bit-identical
    # to fastembed 0.8.0 on 2,259 texts (cosine 1.0, max abs diff 0.0). See
    # backlog/B353.md, B355.md, B512.md.
    # onnxruntime and tokenizers are exact-pinned (like fastembed was), not
    # floored like most deps below: vectors are schema-load-bearing
    # (FLOAT[384], re-embedding required on any change), so a floating floor
    # could silently pull a release that changes the numbers. Matches
    # requirements.txt. huggingface_hub and numpy are plumbing: floors suffice.
    "onnxruntime==1.29.0",
    "tokenizers==0.23.2",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    # B390: embedded ANN + FTS5 store that replaces Kùzu's
    # QUERY_VECTOR_INDEX / QUERY_FTS_INDEX once neither the graph nor the
    # vector/lexical planes have a SPARQL equivalent (docs/rdf-schema-
    # mapping.md §5). Dual-licensed MIT / Apache-2.0 (confirmed via
    # installed package METADATA, License field: "MIT License, Apache
    # License, Version 2.0" -- both compatible with this project's
    # Apache-2.0 license).
    "sqlite-vec>=0.1.6",
    # B389 / B397: RDF-star store (campy/brain/hippocampus/graph/oxigraph_client.py)
    # following B397's cutover from Kùzu to Oxigraph. Exact-
    # pinned like onnxruntime above: oxigraph_client.py's implementation
    # notes document empirically-observed 0.5.11 storage-layer behavior
    # (e.g. XSD-integer-derived datatypes canonicalizing to xsd:integer)
    # that a floating floor could silently change under a newer release.
    # Dual-licensed MIT / Apache-2.0 (confirmed via `pip show pyoxigraph` on
    # the installed 0.5.11 wheel: "License: MIT OR Apache-2.0" — both
    # compatible with this project's Apache-2.0 license).
    "pyoxigraph==0.5.11",
    # B507: SHACL validation of model-extracted Observations (the write gate,
    # `[observations] shacl_gate`, default off) and the graph structure report.
    # Pure Python (rdflib is its only real dependency), imported lazily.
    # BSD-3-Clause / Apache-2.0 compatible with this project's license.
    "pyshacl>=0.30,<1",
    "rdflib>=7.0,<8",
    # B400: verified this does NOT transitively pull in torch/torchvision.
    # thinc (spacy's ML backend) lists torch only behind an opt-in extra
    # (`thinc[torch]`) that neither spacy nor this list requests -- a clean
    # `pip install -r requirements.txt && pip install -e .` installs zero
    # torch package, and running the real ingestion path never puts torch
    # in sys.modules (tests/test_no_torch_dependency.py is the regression
    # guard). If you ever add a dependency that hard-requires torch again
    # (sentence-transformers is the historical offender -- see B355), that
    # test will start failing: thinc.compat unconditionally *attempts*
    # `import torch` for backend auto-detection, and if it's importable
    # for any reason it succeeds and costs ~150-160MB RSS even though
    # en_core_web_md's pipeline (NumpyOps backend, no transformer
    # component) never uses it. See backlog/B400.md.
    "spacy>=3.8.3",
    # B515: preshed 3.0.14 breaks spacy's tokenizer load; see requirements.txt.
    "preshed<3.0.14",
    "typer>=0.9.0",
    "j2toon>=0.1.0",
    "tree-sitter-languages>=1.10.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "packaging>=24.0",
    "openai>=1.58.1",
    # Floors aligned with reviewed FastAPI/Starlette CVE remediation set.
    "fastapi>=0.133.0",
    "starlette>=1.6.0",
    "uvicorn>=0.32.1",
    "rich>=13.0.0",
    # B340: Dependency floors matching reviewed requirements.txt pins
    "PyYAML>=6.0.2",    # Used by benchmarks and temporal_lobe.dictionary
    "psutil>=6.1.1",    # Used by benchmark harness for system metrics
    "tomli>=2.2.1",     # TOML parser fallback (Python < 3.11 compat)
]

[project.optional-dependencies]
# B523: WordNet lexnames make the ownership rule's "ownable noun" test work before the graph has the kind.
# Needs the corpus too: python -m nltk.downloader wordnet. Without it the rule uses graph kinds only.
wordnet = ["nltk>=3.8"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.4.0",  # B399: per-test timeout, see requirements.txt
    "build>=1.0",
    "twine>=5.0",
    "black>=24.1.0",    # B340: Code formatter with version floor
    "ruff>=0.4.0",      # B340: Linter with version floor
    # boto3 is an optional runtime dependency (see the `bedrock` extra below) —
    # it is listed here too purely so `tests/test_bedrock_provider.py` can
    # exercise BedrockLLMClient against a stubbed boto3 client without every
    # local user being made to install AWS libraries.
    "boto3>=1.34.0",
]
test = [
    # Test-only dependency for migration verification and historical backward-compatibility tests
    "kuzu==0.11.3",
]
ollama = ["ollama-python>=0.1.0"]
bedrock = ["boto3>=1.34.0"]
observability = [
    "arize-phoenix-otel>=0.7.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]
indicator = [
    "pystray>=0.19",
    # B512: pillow is no longer pulled in by fastembed, so this extra is its
    # only source. Floor at 13.0.0: it fixes the advisories B500 tracked.
    "Pillow>=13.0.0",
]

[project.scripts]
campy = "campy.cli.main:app"
campy-daemon = "campy.daemon:main"

[project.urls]
Homepage = "https://github.com/engramist/hippocampy"
Issues = "https://github.com/engramist/hippocampy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["campy*", "adapters*", "web*"]

[tool.setuptools.package-data]
"campy.data" = ["**/*.md", "**/*.py", "**/*.toml", "**/*.json", "**/*.sh", "**/.*"]
"campy.brain.hippocampus.shapes" = ["*.ttl"]
"*" = ["campy.toml"]
