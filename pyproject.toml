[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hippocampy"
version = "0.1.0"
description = "Local AI memory system with gated consolidation loop and graph-native Kùzu database"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "HippoCampy", email = "hello@hippocampy.dev" }]
keywords = ["ai", "memory", "graph-database", "mcp", "knowledge-graph", "kuzu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.12,<3.14"
dependencies = [
    "kuzu==0.11.3",
    # B355: fastembed/ONNX Runtime replaced sentence-transformers/PyTorch as
    # the local embedding backend -- same model (sentence-transformers/all-
    # MiniLM-L6-v2, via its ONNX conversion), ~60-80MB instead of ~1.2GB.
    # Verified near-perfect output parity (cosine similarity 1.000000 across
    # 200 real test sentences). See backlog/B353.md and backlog/B355.md.
    # Exact-pinned (like kuzu above), not floored like most deps below:
    # output parity was verified against 0.8.0 specifically, and embedding
    # vectors are schema-load-bearing (FLOAT[384], re-embedding required on
    # any change) -- a floating floor could silently pull a newer fastembed
    # with different ONNX conversion behavior. Matches requirements.txt.
    "fastembed==0.8.0",
    # B390: embedded ANN + FTS5 store that will replace Kùzu's
    # QUERY_VECTOR_INDEX / QUERY_FTS_INDEX once neither the graph nor the
    # vector/lexical planes have a SPARQL equivalent (docs/rdf-schema-
    # mapping.md §5). Dual-licensed MIT / Apache-2.0 (confirmed via
    # installed package METADATA, License field: "MIT License, Apache
    # License, Version 2.0" -- both compatible with this project's
    # Apache-2.0 license).
    "sqlite-vec>=0.1.6",
    # B389: RDF-star store (campy/brain/hippocampus/graph/oxigraph_client.py)
    # coexisting with kuzu (see that module's docstring; kuzu is not removed
    # here — both engines coexist until B397 cuts gateway.py over). Exact-
    # pinned like kuzu/fastembed above: oxigraph_client.py's implementation
    # notes document empirically-observed 0.5.11 storage-layer behavior
    # (e.g. XSD-integer-derived datatypes canonicalizing to xsd:integer)
    # that a floating floor could silently change under a newer release.
    # Dual-licensed MIT / Apache-2.0 (confirmed via `pip show pyoxigraph` on
    # the installed 0.5.11 wheel: "License: MIT OR Apache-2.0" — both
    # compatible with this project's Apache-2.0 license).
    "pyoxigraph==0.5.11",
    "spacy>=3.8.3",
    "typer>=0.9.0",
    "j2toon>=0.1.0",
    "tree-sitter-languages>=1.10.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "packaging>=24.0",
    "openai>=1.58.1",
    # Floors aligned with reviewed FastAPI/Starlette CVE remediation set.
    "fastapi>=0.133.0",
    "starlette>=1.6.0",
    "uvicorn>=0.32.1",
    "rich>=13.0.0",
    # B340: Dependency floors matching reviewed requirements.txt pins
    "PyYAML>=6.0.2",    # Used by benchmarks and temporal_lobe.dictionary
    "psutil>=6.1.1",    # Used by benchmark harness for system metrics
    "tomli>=2.2.1",     # TOML parser fallback (Python < 3.11 compat)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.4.0",  # B399: per-test timeout, see requirements.txt
    "build>=1.0",
    "twine>=5.0",
    "black>=24.1.0",    # B340: Code formatter with version floor
    "ruff>=0.4.0",      # B340: Linter with version floor
    # boto3 is an optional runtime dependency (see the `bedrock` extra below) —
    # it is listed here too purely so `tests/test_bedrock_provider.py` can
    # exercise BedrockLLMClient against a stubbed boto3 client without every
    # local user being made to install AWS libraries.
    "boto3>=1.34.0",
]
ollama = ["ollama-python>=0.1.0"]
bedrock = ["boto3>=1.34.0"]
observability = [
    "arize-phoenix-otel>=0.7.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]
indicator = [
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
campy = "campy.cli.main:app"
campy-daemon = "campy.daemon:main"

[project.urls]
Homepage = "https://github.com/engramist/hippocampy"
Issues = "https://github.com/engramist/hippocampy/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["campy*", "adapters*", "web*"]

[tool.setuptools.package-data]
"campy.data" = ["**/*.md", "**/*.py", "**/*.toml", "**/*.json", "**/*.sh", "**/.*"]
"*" = ["campy.toml"]
