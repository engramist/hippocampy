name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # en_core_web_md is required (en_core_web_sm has no trained dependency
      # parser, needed for Step 1b verb patterns) — see requirements.txt.
      - name: Download spaCy model
        run: python -m spacy download en_core_web_md

      # B293: fail if generated extension tool definitions have drifted from
      # tool_schemas.TOOLS. Lives here (not security-gate.yml) because the
      # generator imports campy, which requires the project to be installed.
      - name: Verify generated extension tools are up to date
        run: |
          python scripts/generate_extension_tools.py
          git diff --exit-code extensions/hippocampy/src/generated_tools.ts

      # B314: fail if inline Cypher outside the allowlist (or execute_raw()
      # escape-hatch call sites) increased relative to scripts/cypher_baseline.json.
      - name: Check Cypher ratchet
        run: python scripts/check_cypher_ratchet.py

      - name: Check dependency floor drift
        run: python scripts/check_dependency_pin_drift.py

      # Fail if a backlog card's `Plan:` header names a backlog/plans/*.md
      # file that does not exist. Pure file-tree check, no imports needed.
      - name: Check backlog plan pointers
        run: python scripts/check_backlog_plan_pointers.py

      - name: Run test suite
        run: pytest tests/ -q
