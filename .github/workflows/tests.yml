name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # B387: spaCy (en_core_web_md, ~225MB of torch/thinc) replaced with a
      # small (~66MB) ONNX NER model — see
      # campy/brain/temporal_lobe/loop/onnx_ner_engine.py. Tests run the real
      # model (zero-mock; tests/patent_claims/ requires it), so it still
      # needs fetching once per run, just a much smaller download.
      - name: Download ONNX NER model
        run: python -c "from campy.brain.temporal_lobe.loop.onnx_ner_engine import download_model; download_model()"

      # B293: fail if generated extension tool definitions have drifted from
      # tool_schemas.TOOLS. Lives here (not security-gate.yml) because the
      # generator imports campy, which requires the project to be installed.
      - name: Verify generated extension tools are up to date
        run: |
          python scripts/generate_extension_tools.py
          git diff --exit-code extensions/hippocampy/src/generated_tools.ts

      # B314: fail if inline Cypher outside the allowlist (or execute_raw()
      # escape-hatch call sites) increased relative to scripts/cypher_baseline.json.
      - name: Check Cypher ratchet
        run: python scripts/check_cypher_ratchet.py

      - name: Check dependency floor drift
        run: python scripts/check_dependency_pin_drift.py

      - name: Run test suite
        run: pytest tests/ -q
