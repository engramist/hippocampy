name: Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # Job 1: CodeQL — static security analysis
  # Reports findings to the GitHub Security tab (not to the structured PR
  # comment — that is Semgrep/pip-audit only). To block PRs on CodeQL alerts,
  # configure branch protection → Code Scanning → alert severity "Error"
  # in repo Settings → Code security → Protection rules.
  # -------------------------------------------------------------------------
  codeql:
    name: CodeQL
    # Skip while the repo is private: SARIF upload requires GitHub code
    # scanning, which is only available on public repos (or paid Advanced
    # Security). The analysis itself succeeded on every run — only the upload
    # failed. This condition self-activates the gate the moment the repo goes
    # public at launch, with no workflow change needed.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change that touches only learnings/ (plan, status, dated notes) cannot change
      # what the code does: no test, script or package reads that folder. The job still
      # reports success, so the required check is satisfied, but the slow steps are skipped.
      - name: Detect notes-only change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          notes_only=false
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^learnings/'; then
              notes_only=true
            fi
          fi
          echo "notes_only=$notes_only" >> "$GITHUB_OUTPUT"
          echo "notes_only=$notes_only"

      - name: Initialize CodeQL
        if: steps.scope.outputs.notes_only != 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.scope.outputs.notes_only != 'true'
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------------------
  # Job 2: Semgrep + pip-audit — pattern checks + dependency CVEs
  # Parses output and posts a structured findings table on the PR.
  # -------------------------------------------------------------------------
  semgrep-pip:
    name: Semgrep + pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change that touches only learnings/ (plan, status, dated notes) cannot change
      # what the code does: no test, script or package reads that folder. The job still
      # reports success, so the required check is satisfied, but the slow steps are skipped.
      - name: Detect notes-only change
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          notes_only=false
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^learnings/'; then
              notes_only=true
            fi
          fi
          echo "notes_only=$notes_only" >> "$GITHUB_OUTPUT"
          echo "notes_only=$notes_only"

      - name: Set up Python 3.11
        if: steps.scope.outputs.notes_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review tools
        if: steps.scope.outputs.notes_only != 'true'
        run: pip install semgrep pip-audit

      - name: Run Semgrep
        if: steps.scope.outputs.notes_only != 'true'
        # || true: let review_gate.py be the gate, not the Semgrep exit code
        run: |
          semgrep \
            --json \
            --config .semgrep/ \
            --config "p/python" \
            --output semgrep-results.json \
            campy/ || true

      - name: Audit project dependencies (isolated from review tooling)
        if: steps.scope.outputs.notes_only != 'true'
        # Install the project into a clean venv, freeze its resolved deps, and
        # audit only those — so Semgrep/pip-audit's own dependencies don't show
        # up as spurious findings. Covers both requirements.txt and pyproject.toml.
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet --upgrade pip
          /tmp/audit-venv/bin/pip install --quiet -e . 2>/dev/null \
            || /tmp/audit-venv/bin/pip install --quiet -r requirements.txt \
            || true
          /tmp/audit-venv/bin/pip freeze > /tmp/project-reqs.txt
          pip-audit -r /tmp/project-reqs.txt \
            --format json \
            --output pip-audit-results.json || true

      - name: Post findings and gate
        if: steps.scope.outputs.notes_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/review_gate.py \
            --semgrep semgrep-results.json \
            --pip-audit pip-audit-results.json \
            --phase Security
