  - {id: c17, label: constraint, probe: emotional, text: "I told you, stop editing generated files by hand!"}
  - {id: c18, label: constraint, probe: emotional, text: "For the third time: do not touch the patent evidence pack without asking."}
  - {id: c19, label: constraint, probe: clear, text: "Every backlog card must include acceptance criteria."}
  - {id: c20, label: constraint, probe: clear, text: "Tests are never allowed to talk to the live daemon."}
  - {id: c21, label: constraint, probe: no_keyword, text: "Keep secrets out of the activity log."}
  - {id: c22, label: constraint, probe: no_keyword, text: "No new runtime dependencies without a discussion first."}
  - {id: c23, label: constraint, probe: clear, text: "Assistant turns must not create confirmed decisions on their own."}
  - {id: c24, label: constraint, probe: no_keyword, text: "Don't skip or quarantine failing tests to get CI green."}
  - {id: c25, label: constraint, probe: clear, text: "Ensure all SPARQL goes through the gateway."}
  - {id: c26, label: constraint, probe: no_keyword, text: "Use they/them unless someone has stated their pronouns."}
  - {id: c27, label: constraint, probe: clear, text: "Documenting schema changes in ARCHITECTURE.md is mandatory."}
  - {id: c28, label: constraint, probe: no_keyword, text: "Rebasing someone else's branch is off the table."}

