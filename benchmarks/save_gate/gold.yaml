# B458 — Save-gate labeled set.
#
# Each item: one statement, one label from campy/data/artifact_categories.yaml,
# and a `probe` tag naming what the item tests:
#
#   clear          plain positive with the usual trigger words
#   no_keyword     positive with none of Step 4's trigger words (tests recall)
#   hedged         hedged/speculative language that matches trigger words
#   casual_rule    rule words ("always", "never", "must") used descriptively
#   descriptive    decision words ("selected", "chosen", "merged") used descriptively
#   past_status    completed work / status report
#   question       question or proposal, nothing settled
#   overlap        fits several categories; label set by spec precedence
#   emotional      emotional language (amygdala salience)
#   chit_chat      no work content
#   fact           observation / fact about the system
#
# PROVENANCE: author-written and author-labeled (Claude, 2026-09-30), not drawn
# from real sessions. Needs review by the project owner. Small n: treat metric
# differences under ~10 points as noise.

version: 1

items:

  # ---------------------------------------------------------------- decision
  - {id: d01, label: decision, probe: clear, text: "We decided to use PostgreSQL for the job queue instead of Redis."}
  - {id: d02, label: decision, probe: clear, text: "We chose Oxigraph over Kuzu for the primary store."}
  - {id: d03, label: decision, probe: clear, text: "We went with fastembed so the daemon no longer needs PyTorch."}
  - {id: d04, label: decision, probe: clear, text: "We agreed to ship the CLI before the web dashboard."}
  - {id: d05, label: decision, probe: clear, text: "Decision: the plugin installs skills per user, not per project."}
  - {id: d06, label: decision, probe: clear, text: "We settled on JSON Lines for the offline queue format."}
  - {id: d07, label: decision, probe: no_keyword, text: "Let's go with SQLite for the vector store."}
  - {id: d08, label: decision, probe: no_keyword, text: "OK, Postgres it is."}
  - {id: d09, label: decision, probe: no_keyword, text: "We're dropping the SSE transport entirely."}
  - {id: d10, label: decision, probe: no_keyword, text: "Auth lives in the gateway, not in each service."}
  - {id: d11, label: decision, probe: no_keyword, text: "We'll use pytest-timeout with the thread method."}
  - {id: d12, label: decision, probe: no_keyword, text: "The daemon will talk to adapters over a Unix socket rather than TCP."}
  - {id: d13, label: decision, probe: no_keyword, text: "We no longer use the v1 recall API."}
  - {id: d14, label: decision, probe: no_keyword, text: "Scratch the Redis idea, we're staying on the in-process cache."}
  - {id: d15, label: decision, probe: no_keyword, text: "Use uv instead of pip for the installer."}
  - {id: d16, label: decision, probe: no_keyword, text: "The benchmark harness switches to LoCoMo-10 as the primary suite."}
  - {id: d17, label: decision, probe: clear, text: "After the review we finalized the schema: one node per statement."}
  - {id: d18, label: decision, probe: no_keyword, text: "Rename the package to hippocampy and keep campy as the CLI name."}
  - {id: d19, label: decision, probe: no_keyword, text: "We're moving the embeddings to ONNX Runtime."}
  - {id: d20, label: decision, probe: no_keyword, text: "Llama 3.1 8B is the default local model going forward."}
  - {id: d21, label: decision, probe: clear, text: "We selected Anthropic as the default cloud provider."}
  - {id: d22, label: decision, probe: no_keyword, text: "We're reverting to the old tokenizer; the new one broke Unicode handling."}
  - {id: d23, label: decision, probe: emotional, text: "Yes! Love it, let's go with the graph-native routing table."}
  - {id: d24, label: decision, probe: no_keyword, text: "The dashboard stays loopback-only."}
  - {id: d25, label: decision, probe: no_keyword, text: "Keep the regex senses as a fallback when Ollama is down."}
  - {id: d26, label: decision, probe: no_keyword, text: "Instead of a cron job, the sweep runs inside the daemon."}
  - {id: d27, label: decision, probe: clear, text: "We resolved the naming debate: tools are verbs, resources are nouns."}
  - {id: d28, label: decision, probe: no_keyword, text: "Fine, we'll skip Windows support for the first release."}

  # -------------------------------------------------------------- constraint
  - {id: c01, label: constraint, probe: clear, text: "Never commit API keys to the repository."}
  - {id: c02, label: constraint, probe: clear, text: "The daemon must not listen on a TCP port."}
  - {id: c03, label: constraint, probe: clear, text: "Always run the full test suite before pushing to main."}
  - {id: c04, label: constraint, probe: clear, text: "Writing outside the project directory is forbidden."}
  - {id: c05, label: constraint, probe: clear, text: "All file paths must be canonicalized with realpath before use."}
  - {id: c06, label: constraint, probe: clear, text: "Force-pushing to shared branches is prohibited."}
  - {id: c07, label: constraint, probe: clear, text: "Make sure every new tool is added to the adapter allow-lists."}
  - {id: c08, label: constraint, probe: no_keyword, text: "Don't use mocks in the integration tests."}
  - {id: c09, label: constraint, probe: no_keyword, text: "No raw Cypher outside the query registry."}
  - {id: c10, label: constraint, probe: no_keyword, text: "Don't ever store persistent state in Python dicts; the graph is the source of truth."}
  - {id: c11, label: constraint, probe: no_keyword, text: "Stop adding print statements to the daemon, use the logger."}
  - {id: c12, label: constraint, probe: no_keyword, text: "Only loopback binds for the dashboard, full stop."}
  - {id: c13, label: constraint, probe: no_keyword, text: "Don't put model identifiers in commit messages."}
  - {id: c14, label: constraint, probe: overlap, text: "We decided we must never log full prompt bodies."}
  - {id: c15, label: constraint, probe: overlap, text: "We agreed that migrations always get a rollback script."}
