# Campy default configuration template.
# User-specific runtime config belongs at ~/.campy/config.toml.

[llm]
provider = "ollama"
# Default confirmed by the B304/B307 ask-eval harness (benchmarks/ask_eval/,
# see benchmarks/RESULTS.md "Model Default Decision" for the full writeup):
# once B305/B306/B307 fixed retrieval-layer bugs, llama3.1:8b tied with
# gemma4:e4b and qwen3:8b on eval score (0.69/1.0) while being the fastest
# (~1.4s median vs 2.3-4.5s) and smallest (4.9GB) of the tied group. Do not
# swap this without re-running the eval matrix — retrieval quality, not raw
# model size, was the actual bottleneck the whole time.
model = "llama3.1:8b"
base_url = "http://localhost:11434/v1"
# B494: output-token cap on every LLM call (default 2048; 0 = no cap). Stops a
# degenerate repetition running until the request timeout. A caller that needs
# more passes max_tokens= per call. CAMPY_LLM_MAX_TOKENS overrides.
# max_tokens = 2048

[embeddings]
provider = "sentence-transformers"
model = "sentence-transformers/all-MiniLM-L6-v2"

[capture]
enabled = true

[capture.codex]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.claude_code]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.vscode]
enabled = true
scan_interval_seconds = 15
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 5

[web]
port = 7799

# B472 Phase 3: source-grounded Observations extracted from user turns.
# On by default. The
# dedicated worker makes one extra LLM call per user turn (CAMPY_OBSERVATIONS_ENABLED=0
# turns it off without editing this file).
# B575: the former members of the "principled" profile are on by default (step 4 and step 0c: two ties with main);
# both profiles are now the same config. They are left unset here (the defaults live in _DEFAULT_CONFIG), so a copied
# template never pins them; each keeps its env var to turn it off.
[observations]
enabled = true
llm_enabled = true       # only read when enabled
llm_batch_turns = 20
idle_flush_seconds = 5   # (llm_batch_turns / idle_flush_seconds: reserved, not read yet)
max_turn_chars = 600
queue_max = 5000         # worker queue bound; a full queue drops the newest, counted
# 3c: when true and the store holds Observations that match the question, the bundle's
# semantic section carries them (each with its evidence quote) instead of Concepts/Decisions.
# CAMPY_OBSERVATIONS_RETRIEVAL=0 turns it off without editing this file.
retrieval = true
observation_limit = 8    # most Observations the semantic section carries
# B507/B514: validate each extracted Observation against the SHACL shapes before it is written;
# a non-conforming draft is rejected as `shacl_violation`. Gate R93: neutral (1 gained / 1 lost).
# Skipped (logged once) if pyshacl/rdflib cannot be imported. CAMPY_SHACL_GATE=0 turns it off.
shacl_gate = true
# B509/B514: has_attribute names become OWL attribute properties (functional ones supersede older
# values; replaces B499's string rule `supersede`, which stays off). CAMPY_OWL_PROPERTIES=0 turns it off.
owl_properties = true
# B504/B514: the extractor also emits each claim's object entity, kind and cardinality, written as
# Concepts; also extracts facts stated inside requests and plans. Roughly 20-40% more output tokens
# per fact-bearing turn. Gate R96 (all four structure flags on, graph_linking_limit 0): LoCoMo 0.517
# vs main 0.525, 7 gained / 8 lost (neutral); SHACL conformance 90.4% -> 95.1%.
# CAMPY_OBSERVATIONS_ENTITIES=0 turns it off.
entities = true
# B522: record each Observation's subject and object Concepts as HAS_SUBJECT / HAS_OBJECT edges
# (OBSERVATION_ABOUT stays). On since B575. CAMPY_OBSERVATIONS_OBJECT_ROLES=0 turns it off.
# object_roles = true  # B522; default on since B575 (from _DEFAULT_CONFIG)
# B523: a grammar rule writes `owns` Observations (subject = the speaker, object = an existing Concept)
# for first-person possession ("my dog Toby", "I adopted Buddy"). On since B575.
# CAMPY_OBSERVATIONS_OWNERSHIP_RULE=0 turns it off.
# ownership_rule = true  # B523; default on since B575 (from _DEFAULT_CONFIG)
# B546: the object of a fact is a typed entity: at write time a rule links it (HAS_OBJECT) to an admitted entity or
# an ObjectPhrase node and types it (INSTANCE_OF) from a kind the sentence states, WordNet places, the speakers
# or its head noun; no model. On since B575. CAMPY_TYPED_OBJECTS=0 turns it off.
# typed_objects = true  # B546; default on since B575 (from _DEFAULT_CONFIG)
# B554: an Observation is linked (OBSERVATION_ABOUT) to every entity B544 admitted whose occurrence lies in its
# evidence (the quote located in its turn, then its clause by the dependency parse); no model, needs entity_admission.
# On since B575. CAMPY_EVIDENCE_ENTITY_LINKS=0 turns it off.
# evidence_entity_links = true  # B554; default on since B575 (from _DEFAULT_CONFIG)
# B564: the extraction form also asks for an action, a with list and a place; a rule confirms each span in the turn and
# writes HAS_ACTION (a WordNet action Concept, no embedding), HAS_PARTICIPANT and HAS_PLACE, and lets has_attribute /
# is_a hold a physical common noun. Off until gated; in no profile yet; no backfill. CAMPY_OBSERVATION_ROLES=1 turns it on.
# roles = false  # B564
# Item 3: facts about "we" (the speaker, flagged group_subject) and people named by relation ("my kids": a Concept
# RELATION_OF the speaker). Off until measured; in no profile. CAMPY_OBSERVATION_GROUP_SUBJECTS=1 turns it on.
# group_subjects = false  # item 3
# "we" facts the extractor already proposes get the speaker as subject (group_subject), prompt untouched; partners
# only as the person in "X and I" or after "with". Off until gated; in no profile. CAMPY_OBSERVATION_GROUP_ANCHOR=1.
# group_anchor = false  # 2026-11-15
# B499: newer attribute value supersedes older by string rule. Off; owl_properties replaces it.
supersede = false
# B538: relative time expressions in user turns ("yesterday", "last week") resolved by rule against
# the turn's date at capture and shown as "yesterday [= 2023-05-07]" in the bundle. Gate R104 vs R103
# (unseen LoCoMo): 0.450 -> 0.503, 28 gained / 12 lost, all 5 conversations up. Turns stored before
# this was on carry no annotation until `backfill_turn_mentions` runs. CAMPY_TURN_DATES=0 turns it off.
turn_dates = true

[retrieval]
# B501/B514: a user turn ending in "?" that also states something in the first person counts as
# evidence. Gates: LongMemEval oracle preference 0.30 -> 0.567 (10 gained / 2 lost); LoCoMo-10
# replay pooled 0.526 -> 0.548 (22 gained / 10 lost, up on 3 of 4).
# CAMPY_RETRIEVAL_CONVERSATION_EMBEDDED_STATEMENTS=0 turns it off.
conversation_embedded_statements = true
# B503/B508/B514: graph linking and the SKOS kind vocabulary are WRITTEN by default (gate R96:
# 0.517 vs 0.525, 7 gained / 8 lost, neutral; Observations linked to a Concept 79.5% -> 94.9%).
# graph_linking_limit = 0 means the retrieval walk adds no section (the v1 walk lost: R95 7 / 14).
graph_linking = true
# graph_linking_limit = 0  # B503 walk cap; the walk is off and was deleted from the profile (B575); its code goes in B576
# B524: a count/list question ("how many pets does X have") adds a graph_count bundle section computed by a
# subject-anchored graph query (needs object_roles and ownership_rule). On since B575.
# CAMPY_GRAPH_COUNT=0 turns it off.
# graph_count = true  # B524; default on since B575 (from _DEFAULT_CONFIG)
# Step 3 of the e2e plan: the subject-anchored query_hits rows enter the bundle as a graph_facts section (fact
# contract lines, shaped by the question analysis); graph_count is not built while it is on. Off until gated.
# CAMPY_GRAPH_FACTS=1 turns it on.
# graph_facts = false  # in no profile
# Object-text matching: the question's words are matched by sentence vector against the object text of the subject's
# own live facts (top 3 per word, cosine >= 0.75); matched facts are read with the exact-label ones in the graph_facts
# section. Needs graph_facts. Off until gated. CAMPY_OBJECT_TEXT_MATCH=1 turns it on.
# object_text_match = false  # in no profile
# B547: the question is analysed once (shape, subject, kind, Concepts named) and the stages read it. On since B575.
# CAMPY_QUESTION_ANALYSIS=0 turns it off.
# question_analysis = true  # B547; default on since B575 (from _DEFAULT_CONFIG)
# B548: the graph's evidence turns (the subject's Observations matching the kind asked or the entities named) are a
# third ranked list in conversation seed selection. Needs question_analysis. On since B575.
# CAMPY_GRAPH_VOTE=0 turns it off.
# graph_vote = true  # B548; default on since B575 (from _DEFAULT_CONFIG)
# turn_rerank = false  # B578: cross-encoder reranks the conversation turns (off; needs turn_rerank_path)
# turn_rerank_path = ""  # B578: local folder holding the cross-encoder; nothing is downloaded
skos_vocab = true

[loop]
# B544: every named entity (PERSON, WORK_OF_ART, GPE, ORG, PRODUCT, LOC, FAC, EVENT, NORP) found in a
# user turn becomes a Concept with its NER label and a MENTIONS edge, whatever Loop steps 2 and 4
# decide. On by default since B575. CAMPY_ENTITY_ADMISSION=0 turns it off.
# entity_admission = true  # default on since B575 (from _DEFAULT_CONFIG)
# B549: an admitted entity's standing (confirmed / doubtful / unverified) is derived by rule (speakers, capitalisation
# evidence in its conversation) and a wrapped span ("Yep Deb") is trimmed to the name it holds; the tagger's label
# stays evidence. Needs entity_admission. On by default since B575.
# CAMPY_ENTITY_STANDING=0 turns it off.
# entity_standing = true  # default on since B575 (from _DEFAULT_CONFIG)
# B543: Loop steps 2-7 (the original decision tracker, deprecated) only add records: a contradiction verdict stores the
# new Concept and a DisambiguationEvent and archives nothing; a Loop failure never drops the turn's Observation
# extraction. Warns at start when entity_admission is off. On by default since B575.
# CAMPY_TRACKER_SIDE_BRANCH=0 turns it off.
# tracker_side_branch = true  # default on since B575 (from _DEFAULT_CONFIG)
# B560: a turn's named speaker is linked by `Message -SPOKEN_BY-> Concept` (the speaker's Person Concept). The concept
# walk reads it, so a linked turn must be the question's subject's own. On by default since B575.
# CAMPY_SPOKEN_BY=0 turns it off.
# spoken_by = true  # default on since B575 (from _DEFAULT_CONFIG)

[wiki_projection]
enabled = true
vault_dir = "wiki"
output_dir = "wiki/personas/default"
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
max_backlinks = 25
obsidian_vault_name = "wiki"

[[wiki_projection.personas]]
name = "engineer"
output_dir = "wiki/personas/engineer"
include_domains = ["architecture", "implementation", "testing"]
include_node_types = ["Decision", "Constraint", "Procedure", "Lesson"]
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
home_title = "Engineering Memory"

[[wiki_projection.personas]]
name = "researcher"
output_dir = "wiki/personas/researcher"
include_domains = ["research", "evaluation", "benchmarks"]
include_node_types = ["Lesson", "KnowledgeGap", "Procedure"]
max_pages_per_sweep = 40
max_chars_per_page = 7000
max_related_pages = 10
home_title = "Research Memory"
