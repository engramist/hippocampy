# Campy default configuration template.
# User-specific runtime config belongs at ~/.campy/config.toml.

[llm]
provider = "ollama"
# Default confirmed by the B304/B307 ask-eval harness (benchmarks/ask_eval/,
# see benchmarks/RESULTS.md "Model Default Decision" for the full writeup):
# once B305/B306/B307 fixed retrieval-layer bugs, llama3.1:8b tied with
# gemma4:e4b and qwen3:8b on eval score (0.69/1.0) while being the fastest
# (~1.4s median vs 2.3-4.5s) and smallest (4.9GB) of the tied group. Do not
# swap this without re-running the eval matrix — retrieval quality, not raw
# model size, was the actual bottleneck the whole time.
model = "llama3.1:8b"
base_url = "http://localhost:11434/v1"
# B494: output-token cap on every LLM call (default 2048; 0 = no cap). Stops a
# degenerate repetition running until the request timeout. A caller that needs
# more passes max_tokens= per call. CAMPY_LLM_MAX_TOKENS overrides.
# max_tokens = 2048

[embeddings]
provider = "sentence-transformers"
model = "sentence-transformers/all-MiniLM-L6-v2"

[capture]
enabled = true

[capture.codex]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.claude_code]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.vscode]
enabled = true
scan_interval_seconds = 15
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 5

[web]
port = 7799

# B472 Phase 3: source-grounded Observations extracted from user turns.
# On by default. The
# dedicated worker makes one extra LLM call per user turn (CAMPY_OBSERVATIONS_ENABLED=0
# turns it off without editing this file).
[observations]
enabled = true
llm_enabled = true       # only read when enabled
llm_batch_turns = 20
idle_flush_seconds = 5   # (llm_batch_turns / idle_flush_seconds: reserved, not read yet)
max_turn_chars = 600
queue_max = 5000         # worker queue bound; a full queue drops the newest, counted
# 3c: when true and the store holds Observations that match the question, the bundle's
# semantic section carries them (each with its evidence quote) instead of Concepts/Decisions.
# CAMPY_OBSERVATIONS_RETRIEVAL=0 turns it off without editing this file.
retrieval = true
observation_limit = 8    # most Observations the semantic section carries
# B507/B514: validate each extracted Observation against the SHACL shapes before it is written;
# a non-conforming draft is rejected as `shacl_violation`. Gate R93: neutral (1 gained / 1 lost).
# Skipped (logged once) if pyshacl/rdflib cannot be imported. CAMPY_SHACL_GATE=0 turns it off.
shacl_gate = true
# B509/B514: has_attribute names become OWL attribute properties (functional ones supersede older
# values; replaces B499's string rule `supersede`, which stays off). CAMPY_OWL_PROPERTIES=0 turns it off.
owl_properties = true
# B504/B514: the extractor also emits each claim's object entity, kind and cardinality, written as
# Concepts; also extracts facts stated inside requests and plans. Roughly 20-40% more output tokens
# per fact-bearing turn. Gate R96 (all four structure flags on, graph_linking_limit 0): LoCoMo 0.517
# vs main 0.525, 7 gained / 8 lost (neutral); SHACL conformance 90.4% -> 95.1%.
# CAMPY_OBSERVATIONS_ENTITIES=0 turns it off.
entities = true
# B522: record each Observation's subject and object Concepts as HAS_SUBJECT / HAS_OBJECT edges
# (OBSERVATION_ABOUT stays). Off until gated. CAMPY_OBSERVATIONS_OBJECT_ROLES=1 turns it on.
object_roles = false
# B523: a grammar rule writes `owns` Observations (subject = the speaker, object = an existing Concept)
# for first-person possession ("my dog Toby", "I adopted Buddy"). Off until gated.
# CAMPY_OBSERVATIONS_OWNERSHIP_RULE=1 turns it on.
ownership_rule = false
# B499: newer attribute value supersedes older by string rule. Off; owl_properties replaces it.
supersede = false

[retrieval]
# B501/B514: a user turn ending in "?" that also states something in the first person counts as
# evidence. Gates: LongMemEval oracle preference 0.30 -> 0.567 (10 gained / 2 lost); LoCoMo-10
# replay pooled 0.526 -> 0.548 (22 gained / 10 lost, up on 3 of 4).
# CAMPY_RETRIEVAL_CONVERSATION_EMBEDDED_STATEMENTS=0 turns it off.
conversation_embedded_statements = true
# B503/B508/B514: graph linking and the SKOS kind vocabulary are WRITTEN by default (gate R96:
# 0.517 vs 0.525, 7 gained / 8 lost, neutral; Observations linked to a Concept 79.5% -> 94.9%).
# graph_linking_limit = 0 means the retrieval walk adds no section (the v1 walk lost: R95 7 / 14).
graph_linking = true
graph_linking_limit = 0
# B524: a count/list question ("how many pets does X have") adds a graph_count bundle section computed by a
# subject-anchored graph query (needs object_roles and ownership_rule). Off until gated.
# CAMPY_GRAPH_COUNT=1 turns it on.
graph_count = false
skos_vocab = true

[wiki_projection]
enabled = true
vault_dir = "wiki"
output_dir = "wiki/personas/default"
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
max_backlinks = 25
obsidian_vault_name = "wiki"

[[wiki_projection.personas]]
name = "engineer"
output_dir = "wiki/personas/engineer"
include_domains = ["architecture", "implementation", "testing"]
include_node_types = ["Decision", "Constraint", "Procedure", "Lesson"]
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
home_title = "Engineering Memory"

[[wiki_projection.personas]]
name = "researcher"
output_dir = "wiki/personas/researcher"
include_domains = ["research", "evaluation", "benchmarks"]
include_node_types = ["Lesson", "KnowledgeGap", "Procedure"]
max_pages_per_sweep = 40
max_chars_per_page = 7000
max_related_pages = 10
home_title = "Research Memory"
