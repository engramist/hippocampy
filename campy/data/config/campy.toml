# Campy default configuration template.
# User-specific runtime config belongs at ~/.campy/config.toml.

[llm]
provider = "ollama"
# Default confirmed by the B304/B307 ask-eval harness (benchmarks/ask_eval/,
# see benchmarks/RESULTS.md "Model Default Decision" for the full writeup):
# once B305/B306/B307 fixed retrieval-layer bugs, llama3.1:8b tied with
# gemma4:e4b and qwen3:8b on eval score (0.69/1.0) while being the fastest
# (~1.4s median vs 2.3-4.5s) and smallest (4.9GB) of the tied group. Do not
# swap this without re-running the eval matrix — retrieval quality, not raw
# model size, was the actual bottleneck the whole time.
model = "llama3.1:8b"
base_url = "http://localhost:11434/v1"

[embeddings]
provider = "sentence-transformers"
model = "sentence-transformers/all-MiniLM-L6-v2"

[capture]
enabled = true

[capture.codex]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.claude_code]
enabled = true
scan_interval_seconds = 10
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 1

[capture.vscode]
enabled = true
scan_interval_seconds = 15
max_events_per_scan = 50
initial_backfill_events = 20
max_initial_backfill_files = 5

[web]
port = 7799

[wiki_projection]
enabled = true
vault_dir = "wiki"
output_dir = "wiki/personas/default"
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
max_backlinks = 25
obsidian_vault_name = "wiki"

[[wiki_projection.personas]]
name = "engineer"
output_dir = "wiki/personas/engineer"
include_domains = ["architecture", "implementation", "testing"]
include_node_types = ["Decision", "Constraint", "Procedure", "Lesson"]
max_pages_per_sweep = 50
max_chars_per_page = 8000
max_related_pages = 12
home_title = "Engineering Memory"

[[wiki_projection.personas]]
name = "researcher"
output_dir = "wiki/personas/researcher"
include_domains = ["research", "evaluation", "benchmarks"]
include_node_types = ["Lesson", "KnowledgeGap", "Procedure"]
max_pages_per_sweep = 40
max_chars_per_page = 7000
max_related_pages = 10
home_title = "Research Memory"
